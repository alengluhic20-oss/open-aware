[pytest]
# Pytest configuration for ML Safety CI/CD tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Markers for categorizing tests
markers =
    unit: Unit tests for individual components
    integration: Integration tests for full pipeline
    slow: Tests that take significant time to run
    requires_gpu: Tests that require GPU hardware

# Minimum Python version
minversion = 3.8

# Coverage options (if pytest-cov is installed)
# Uncomment to enable coverage reporting
# addopts = --cov=scripts --cov-report=html --cov-report=term
